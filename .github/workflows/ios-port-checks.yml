name: iOS source checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: bash tests/run-port-regressions.sh
      - run: bash tests/run-mod-regressions.sh
  native-tools:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install cmake ninja
      - name: Compile the native mod manager against the iPhoneOS SDK
        run: |
          xcrun --sdk iphoneos clang++ -std=c++20 -arch arm64 -miphoneos-version-min=17.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -fobjc-arc -Werror \
            -DMARATHON_RECOMP_IOS -IMarathonRecomp \
            -fsyntax-only MarathonRecomp/ui/ios_mod_manager.mm
      - run: bash ios/prepare.sh
      - run: cmake --preset ios-host-tools
      - run: cmake --build out/build/ios-host-tools --target file_to_c u8extract XenonRecomp XenosRecomp --parallel
      - run: python3 tests/game_inputs_regressions.py --u8extract out/build/ios-host-tools/bin/u8extract
